<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Crash Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0d0f11;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 1.1rem;
            color: #2ed573;
            font-weight: bold;
        }
        .screen {
            height: 220px;
            background: radial-gradient(circle, #1a1e24 0%, #0d0f11 100%);
            border-radius: 12px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .multiplier {
            font-size: 3.5rem;
            font-weight: 800;
        }
        .crashed { color: #ff4757; }
        .running { color: #2ed573; }
        .controls {
            background: #161a1e;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #282c34;
        }
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 12px;
        }
        .quick-amounts button {
            background: #22272e;
            color: #fff;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="number"] {
            width: 95%;
            padding: 10px;
            background: #0d0f11;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .main-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-bet { background: #2ed573; color: #000; }
        .btn-cashout { background: #ffa502; color: #000; }
        .btn-disabled { background: #444; color: #888; cursor: not-allowed; }
        .status { text-align: center; margin-top: 10px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>SUPERSONIC</span>
        <span>Coins: <span id="balance">0</span></span>
    </div>

    <div class="screen">
        <div id="multDisplay" class="multiplier">1.00x</div>
        <div id="statusLabel" class="status">Waiting for next round...</div>
    </div>

    <div class="controls">
        <input type="number" id="betInput" value="10" min="10" step="10">
        <div class="quick-amounts">
            <button onclick="setAmount(50)">50</button>
            <button onclick="setAmount(100)">100</button>
            <button onclick="setAmount(200)">200</button>
            <button onclick="setAmount(500)">500</button>
        </div>
        <button id="actionBtn" class="main-btn btn-bet" onclick="handleAction()">BET</button>
    </div>
</div>

<script>
    const socket = io();
    let currentBalance = 0;
    let currentMultiplier = 1.00;
    let betPlaced = false;
    let canBet = false;

    const balanceEl = document.getElementById('balance');
    const multDisplay = document.getElementById('multDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const actionBtn = document.getElementById('actionBtn');
    const betInput = document.getElementById('betInput');

    socket.on('balance_update', (balance) => {
        currentBalance = balance;
        balanceEl.innerText = balance.toFixed(2);
    });

    socket.on('multiplier_update', (mult) => {
        currentMultiplier = mult;
        multDisplay.innerText = mult.toFixed(2) + 'x';
        if (betPlaced) {
            let winEst = (parseFloat(betInput.value) * mult).toFixed(2);
            actionBtn.innerText = `CASH OUT (${winEst})`;
        }
    });

    socket.on('game_state', (data) => {
        if (data.state === 'WAITING') {
            canBet = true;
            betPlaced = false;
            multDisplay.className = 'multiplier';
            multDisplay.innerText = '1.00x';
            statusLabel.innerText = 'Round starts in ' + data.time + 's...';
            actionBtn.className = 'main-btn btn-bet';
            actionBtn.innerText = 'BET';
            betInput.disabled = false;
        } else if (data.state === 'RUNNING') {
            canBet = false;
            multDisplay.className = 'multiplier running';
            statusLabel.innerText = 'In Flight';
            if (betPlaced) {
                actionBtn.className = 'main-btn btn-cashout';
                actionBtn.innerText = 'CASH OUT';
            } else {
                actionBtn.className = 'main-btn btn-disabled';
                actionBtn.innerText = 'WAIT FOR NEXT ROUND';
            }
        } else if (data.state === 'CRASHED') {
            canBet = false;
            betPlaced = false;
            multDisplay.className = 'multiplier crashed';
            multDisplay.innerText = '@ ' + data.crashPoint.toFixed(2) + 'x';
            statusLabel.innerText = 'FLEW AWAY!';
            actionBtn.className = 'main-btn btn-disabled';
            actionBtn.innerText = 'CRASHED';
        }
    });

    socket.on('bet_confirmed', () => {
        betPlaced = true;
        actionBtn.className = 'main-btn btn-disabled';
        actionBtn.innerText = 'WAITING START...';
        betInput.disabled = true;
    });

    socket.on('cash_out_success', (res) => {
        betPlaced = false;
        actionBtn.className = 'main-btn btn-disabled';
        actionBtn.innerText = 'CASHED OUT';
        statusLabel.innerText = `Won ${res.winAmount} coins at ${res.multiplier}x!`;
    });

    function setAmount(amt) {
        if (!betPlaced && canBet) betInput.value = amt;
    }

    function handleAction() {
        if (canBet && !betPlaced) {
            const amt = parseFloat(betInput.value);
            if (amt > 0 && amt <= currentBalance) {
                socket.emit('place_bet', amt);
            }
        } else if (betPlaced) {
            socket.emit('cash_out');
        }
    }
</script>

</body>
</html>
