<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Aviator Live - Verified Auth</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #0c0f17; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 8px; }
    .app-container { width: 100%; max-width: 950px; background: #121622; border: 1px solid #232a3d; border-radius: 16px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.8); position: relative; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .title { font-size: 22px; font-weight: 900; font-style: italic; color: #ff2b44; letter-spacing: 1px; }
    .user-info-group { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; color: #2ed573; background: rgba(46, 213, 115, 0.1); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(46, 213, 115, 0.25); }
    .wallet { background: #1a2130; border: 1px solid #2c3852; padding: 6px 14px; border-radius: 20px; font-weight: 700; color: #2ecc71; font-size: 14px; text-align: right; }
    .user-phone-label { font-size: 11px; color: #8c9cb3; display: block; line-height: 1; margin-bottom: 3px; }
    .logout-btn { background: #232c40; border: none; color: #ff5252; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

    .history-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
    .history-row::-webkit-scrollbar { display: none; }
    .history-pill { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #171d2b; color: #5ea8f5; border: 1px solid #24314c; white-space: nowrap; }
    .history-pill.top { color: #c950e8; border-color: #8b349b; }

    .stage { position: relative; width: 100%; height: 330px; background: radial-gradient(circle at 10% 90%, #20111f 0%, #090c13 75%); border-radius: 12px; overflow: hidden; border: 1px solid #1f2738; }
    canvas { width: 100%; height: 100%; display: block; }
    .center-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 5; }
    .current-mult { font-size: 58px; font-weight: 900; line-height: 1; text-shadow: 0 4px 18px rgba(0,0,0,0.8); }
    .status-note { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #78859b; margin-top: 6px; }
    .crash-red { color: #ff2b44 !important; }

    .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 650px) { .bet-grid { grid-template-columns: 1fr; } .stage { height: 250px; } .current-mult { font-size: 42px; } }
    .card { background: #161b27; border: 1px solid #232c40; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-top { display: flex; justify-content: space-between; font-size: 11px; color: #7b889e; font-weight: 600; }
    .auto-cash-group { display: flex; align-items: center; gap: 4px; }
    .auto-cash-group input[type="number"] { width: 52px; background: #0b0e14; border: 1px solid #28334b; color: #fff; border-radius: 4px; font-size: 11px; text-align: center; padding: 2px; }
    .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .input-wrapper { background: #0a0d14; border: 1px solid #29344c; border-radius: 8px; display: flex; align-items: center; }
    .input-wrapper input { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 700; text-align: center; outline: none; }
    .action-btn { height: 46px; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-transform: uppercase; transition: filter 0.2s; }
    .action-btn:hover { filter: brightness(1.1); }
    .btn-green { background: linear-gradient(180deg, #2ecc71, #27ae60); }
    .btn-orange { background: linear-gradient(180deg, #f39c12, #d35400); animation: pulse 1s infinite alternate; }
    .btn-red { background: linear-gradient(180deg, #e74c3c, #c0392b); }
    .btn-sub { font-size: 10px; opacity: 0.9; }
    .quick-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .chip-btn { background: #0f131d; border: 1px solid #232c40; color: #8c9cb3; padding: 4px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .chip-btn:hover { background: #222b3f; color: #fff; }
    .live-bets { margin-top: 10px; background: #0a0d14; border: 1px solid #1c2332; border-radius: 8px; padding: 8px 12px; max-height: 75px; overflow-y: auto; font-size: 11px; }
    .live-row { display: flex; justify-content: space-between; color: #78859b; padding: 2px 0; }
    .live-row.win { color: #2ecc71; }
    @keyframes pulse { 0% { box-shadow: 0 0 5px rgba(243, 156, 18, 0.4); } 100% { box-shadow: 0 0 15px rgba(243, 156, 18, 0.85); } }

    /* REAL SMS POPUP BANNER */
    .sms-banner {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: #182030;
      border: 1px solid #38ef7d;
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      z-index: 10000;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .sms-banner.show { top: 20px; }
    .sms-icon { font-size: 28px; }
    .sms-content h4 { font-size: 13px; color: #38ef7d; font-weight: 800; }
    .sms-content p { font-size: 13px; color: #fff; margin-top: 3px; font-weight: bold; }

    /* AUTH MODAL */
    .auth-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 13, 20, 0.97); backdrop-filter: blur(8px); z-index: 100; display: flex; justify-content: center; align-items: center; border-radius: 16px; }
    .auth-card { width: 90%; max-width: 360px; background: #161b29; border: 1px solid #2b354d; border-radius: 16px; padding: 24px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); text-align: center; }
    .auth-card h3 { font-size: 20px; color: #ff2b44; margin-bottom: 4px; font-weight: 900; }
    .auth-card p { font-size: 12px; color: #7b889e; margin-bottom: 18px; }
    .phone-input-group { display: flex; gap: 6px; margin-bottom: 12px; }
    .prefix { background: #0a0d14; border: 1px solid #273249; color: #aaa; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; }
    .auth-input { width: 100%; background: #0a0d14; border: 1px solid #273249; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; }
    .auth-input:focus { border-color: #ff2b44; }
    .auth-btn { width: 100%; background: linear-gradient(180deg, #2ecc71, #27ae60); border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 8px; }
    .auth-btn:active { transform: scale(0.98); }
    .auth-msg { font-size: 12px; margin-top: 10px; color: #ff4757; min-height: 18px; font-weight: 600; word-break: break-word; }
    .change-number { font-size: 11px; color: #5ea8f5; margin-top: 10px; cursor: pointer; text-decoration: underline; display: inline-block; }
  </style>
</head>
<body>

  <!-- Live Simulated Real SMS Push Banner -->
  <div class="sms-banner" id="sms-banner">
    <div class="sms-icon">💬</div>
    <div class="sms-content">
      <h4>MESSAGES • JUST NOW</h4>
      <p id="sms-text">Your OTP is 123456</p>
    </div>
  </div>

  <div class="app-container">
    <!-- AUTH MODAL -->
    <div class="auth-overlay" id="auth-modal">
      <div class="auth-card">
        <h3>AVIATOR LOGIN</h3>
        <p id="auth-subtitle">Apna 10-digit Mobile Number daalein</p>

        <!-- Step 1: Phone Input Screen -->
        <div id="phone-screen">
          <div class="phone-input-group">
            <span class="prefix">+91</span>
            <input type="tel" id="user-phone" class="auth-input" placeholder="10-digit Mobile No." maxlength="10">
          </div>
          <button class="auth-btn" id="send-otp-btn" onclick="sendOTP()">SEND OTP</button>
        </div>

        <!-- Step 2: OTP Verification Screen -->
        <div id="otp-screen" style="display: none;">
          <div style="font-size: 12px; color: #38ef7d; margin-bottom: 8px;" id="otp-phone-display">+91 XXXXXXXXXX</div>
          <input type="number" id="otp-input" class="auth-input" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align: center; letter-spacing: 6px; font-size: 18px;">
          <button class="auth-btn" style="background: linear-gradient(180deg, #ff2b44, #c0392b);" id="verify-otp-btn" onclick="verifyOTP()">VERIFY & PLAY</button>
          <div>
            <span class="change-number" onclick="backToPhone()">Mobile Number Badlein</span>
          </div>
        </div>

        <div class="auth-msg" id="auth-msg"></div>
      </div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title">AVIATOR LIVE</div>
      <div class="user-info-group">
        <div class="badge">● <span id="online-count">1</span> Online</div>
        <div class="wallet">
          <span class="user-phone-label" id="display-user">Mobile: Loading...</span>
          ₹<span id="balance">0.00</span>
        </div>
        <button class="logout-btn" onclick="logout()">Exit</button>
      </div>
    </div>

    <div class="history-row" id="history-box"></div>

    <div class="stage">
      <div class="center-overlay">
        <div class="current-mult" id="multiplier-lbl">1.00x</div>
        <div class="status-note" id="status-note">CONNECTING...</div>
      </div>
      <canvas id="skyCanvas"></canvas>
    </div>

    <div class="bet-grid">
      <!-- Panel 1 -->
      <div class="card" id="card-1">
        <div class="card-top">
          <span>BET PANEL 1</span>
          <label class="auto-cash-group"><input type="checkbox" id="auto-check-1"> Auto: <input type="number" id="auto-val-1" value="2.00" step="0.1" min="1.1">x</label>
        </div>
        <div class="controls-row">
          <div class="input-wrapper"><input type="number" id="amt-1" value="100" min="10" step="10"></div>
          <button class="action-btn btn-green" id="btn-1" onclick="handleBtn(1)"><span>BET</span><span class="btn-sub" id="sub-1">₹100</span></button>
        </div>
        <div class="quick-chips">
          <button class="chip-btn" onclick="addChip(1, 50)">+50</button>
          <button class="chip-btn" onclick="addChip(1, 100)">+100</button>
          <button class="chip-btn" onclick="addChip(1, 500)">+500</button>
          <button class="chip-btn" onclick="addChip(1, 1000)">+1000</button>
        </div>
      </div>

      <!-- Panel 2 -->
      <div class="card" id="card-2">
        <div class="card-top">
          <span>BET PANEL 2</span>
          <label class="auto-cash-group"><input type="checkbox" id="auto-check-2"> Auto: <input type="number" id="auto-val-2" value="1.50" step="0.1" min="1.1">x</label>
        </div>
        <div class="controls-row">
          <div class="input-wrapper"><input type="number" id="amt-2" value="50" min="10" step="10"></div>
          <button class="action-btn btn-green" id="btn-2" onclick="handleBtn(2)"><span>BET</span><span class="btn-sub" id="sub-2">₹50</span></button>
        </div>
        <div class="quick-chips">
          <button class="chip-btn" onclick="addChip(2, 50)">+50</button>
          <button class="chip-btn" onclick="addChip(2, 100)">+100</button>
          <button class="chip-btn" onclick="addChip(2, 500)">+500</button>
          <button class="chip-btn" onclick="addChip(2, 1000)">+1000</button>
        </div>
      </div>
    </div>

    <div class="live-bets" id="live-bets"><div class="live-row"><span>Connecting network...</span></div></div>
  </div>

  <script>
    const socket = io();

    let targetPhone = "";
    let currentUserPhone = null;

    /* ================= 100% WORKING HTTP REST API ================= */
    async function sendOTP() {
      const phoneInput = document.getElementById("user-phone");
      const authMsg = document.getElementById("auth-msg");
      const sendBtn = document.getElementById("send-otp-btn");

      targetPhone = phoneInput.value.trim();

      if (!targetPhone || targetPhone.length !== 10 || isNaN(targetPhone)) {
        authMsg.style.color = "#ff4757";
        authMsg.textContent = "Kripya valid 10-digit mobile number daalein!";
        return;
      }

      authMsg.style.color = "#38ef7d";
      authMsg.textContent = "Sending OTP...";
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: targetPhone })
        });

        const data = await response.json();

        if (data.success) {
          // Instant screen change
          document.getElementById("phone-screen").style.display = "none";
          document.getElementById("otp-screen").style.display = "block";
          document.getElementById("auth-subtitle").textContent = "SMS se 6-digit OTP enter karein";
          document.getElementById("otp-phone-display").textContent = "+91 " + data.phone;
          authMsg.textContent = "";

          // Show SMS Popup
          showSMSBanner(`AVIATOR OTP: ${data.otp}. Yeh code kisi ke sath share na karein.`);

          // Auto-fill OTP
          document.getElementById("otp-input").value = data.otp;
        } else {
          authMsg.style.color = "#ff4757";
          authMsg.textContent = data.message;
        }
      } catch (err) {
        authMsg.style.color = "#ff4757";
        authMsg.textContent = "Network Error! Server start ho raha hai, 10 second baad dobara dabayein.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    function showSMSBanner(text) {
      const banner = document.getElementById("sms-banner");
      document.getElementById("sms-text").textContent = text;
      banner.classList.add("show");
      setTimeout(() => { banner.classList.remove("show"); }, 9000);
    }

    async function verifyOTP() {
      const otpVal = document.getElementById("otp-input").value.trim();
      const authMsg = document.getElementById("auth-msg");
      const verifyBtn = document.getElementById("verify-otp-btn");

      if (!otpVal || otpVal.length !== 6) {
        authMsg.style.color = "#ff4757";
        authMsg.textContent = "6-digit OTP enter karein!";
        return;
      }

      authMsg.style.color = "#38ef7d";
      authMsg.textContent = "Verifying...";
      verifyBtn.disabled = true;

      try {
        const response = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: targetPhone, otp: otpVal })
        });

        const data = await response.json();

        if (data.success) {
          currentUserPhone = data.phone;
          localStorage.setItem("aviator_real_phone", data.phone);

          document.getElementById("auth-modal").style.display = "none";
          document.getElementById("display-user").textContent = "Mob: +91 " + data.phone;
          document.getElementById("balance").textContent = data.balance.toFixed(2);

          socket.emit('set_user_phone', { phone: data.phone });
        } else {
          authMsg.style.color = "#ff4757";
          authMsg.textContent = data.message;
        }
      } catch (err) {
        authMsg.style.color = "#ff4757";
        authMsg.textContent = "Verification Error!";
      } finally {
        verifyBtn.disabled = false;
      }
    }

    function backToPhone() {
      document.getElementById("phone-screen").style.display = "block";
      document.getElementById("otp-screen").style.display = "none";
      document.getElementById("auth-subtitle").textContent = "Apna 10-digit Mobile Number daalein";
      document.getElementById("auth-msg").textContent = "";
    }

    function logout() {
      localStorage.removeItem("aviator_real_phone");
      location.reload();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem("aviator_real_phone");
      if (saved) {
        currentUserPhone = saved;
        document.getElementById("auth-modal").style.display = "none";
        document.getElementById("display-user").textContent = "Mob: +91 " + saved;
        socket.emit('set_user_phone', { phone: saved });
      }
    });

    /* ================= GAME ENGINE ================= */
    const canvas = document.getElementById("skyCanvas");
    const ctx = canvas.getContext("2d");
    const multLbl = document.getElementById("multiplier-lbl");
    const statusNote = document.getElementById("status-note");
    const balanceEl = document.getElementById("balance");
    const historyBox = document.getElementById("history-box");
    const onlineEl = document.getElementById("online-count");
    const liveBetsBox = document.getElementById("live-bets");

    let currentGameState = "COUNTDOWN";
    let serverMultiplier = 1.00;
    let localElapsed = 0;
    let particles = [];
    let propeller = 0;
    let planeX = 0, planeY = 0;
    let gridOffset = 0;

    const panels = {
      1: { status: "IDLE", amount: 0, cashedOut: false },
      2: { status: "IDLE", amount: 0, cashedOut: false }
    };

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function addChip(id, val) {
      const input = document.getElementById(`amt-${id}`);
      input.value = (parseFloat(input.value) || 0) + val;
      updateButtonsUI();
    }

    socket.on('online_count', (count) => { onlineEl.textContent = count; });

    socket.on('round_countdown', (data) => {
      currentGameState = "COUNTDOWN";
      multLbl.classList.remove("crash-red");
      multLbl.textContent = "1.00x";
      statusNote.textContent = `NEXT ROUND IN ${data.seconds}s`;
      particles = [];
      updateHistoryUI(data.history);

      [1, 2].forEach(id => {
        if (panels[id].status === "QUEUED") panels[id].status = "ACTIVE";
        else if (panels[id].status === "WON") panels[id].status = "IDLE";
      });
      updateButtonsUI();
    });

    socket.on('countdown_tick', (data) => { statusNote.textContent = `NEXT ROUND IN ${data.seconds}s`; });

    socket.on('flight_start', () => {
      currentGameState = "FLYING";
      statusNote.textContent = "";
      localElapsed = 0;
      updateButtonsUI();
    });

    socket.on('game_tick', (data) => {
      serverMultiplier = data.multiplier;
      localElapsed = data.elapsed;
      multLbl.textContent = serverMultiplier.toFixed(2) + "x";

      [1, 2].forEach(id => {
        const autoCheck = document.getElementById(`auto-check-${id}`).checked;
        const autoVal = parseFloat(document.getElementById(`auto-val-${id}`).value) || 9999;
        if (autoCheck && panels[id].status === "ACTIVE" && !panels[id].cashedOut && serverMultiplier >= autoVal) {
          socket.emit('cash_out', { panel: id });
        }
      });
      updateButtonsUI();
    });

    socket.on('game_crash', (data) => {
      currentGameState = "CRASHED";
      multLbl.textContent = "FLEW AWAY!";
      multLbl.classList.add("crash-red");
      sta
