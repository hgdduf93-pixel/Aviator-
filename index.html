<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Real-Time Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0c0f17;
      --card: #151a26;
      --accent-red: #ff2b44;
      --green: #2ecc71;
      --orange: #f39c12;
      --text-dim: #7f8c9f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .aviator-container {
      width: 100%;
      max-width: 960px;
      background: #11151f;
      border: 1px solid #232a3b;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    /* Header */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      font-style: italic;
      color: var(--accent-red);
      letter-spacing: 1px;
    }

    .online-badge {
      font-size: 12px;
      color: #2ed573;
      background: rgba(46, 213, 115, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(46, 213, 115, 0.2);
    }

    .balance-box {
      background: #1a202e;
      border: 1px solid #29344c;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      color: #2ecc71;
      font-size: 15px;
    }

    /* Multipliers History Bar */
    .history-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .history-scroll::-webkit-scrollbar { display: none; }

    .hist-pill {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      background: #192030;
      color: #64b5f6;
      border: 1px solid #28334b;
      white-space: nowrap;
    }
    .hist-pill.high {
      color: #c056db;
      border-color: #8b349b;
    }

    /* Flight Stage */
    .stage {
      position: relative;
      width: 100%;
      height: 350px;
      background: radial-gradient(circle at 10% 90%, #1e111d 0%, #0a0d14 75%);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #202738;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .center-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }

    .mult-value {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .stage-msg {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .crashed-text {
      color: var(--accent-red) !important;
    }

    /* Dual Bet Panels */
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    @media (max-width: 720px) {
      .bet-grid { grid-template-columns: 1fr; }
      .stage { height: 260px; }
      .mult-value { font-size: 46px; }
    }

    .panel-card {
      background: var(--card);
      border: 1px solid #232c40;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .auto-cash {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .auto-cash input[type="number"] {
      width: 55px;
      background: #090c13;
      border: 1px solid #29344c;
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      padding: 2px;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-box {
      background: #0a0d14;
      border: 1px solid #29344c;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 4px;
    }

    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .action-btn {
      height: 48px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      transition: filter 0.2s;
    }
    .action-btn:hover { filter: brightness(1.1); }

    .btn-green { background: linear-gradient(180deg, #2ecc71, #27ae60); }
    .btn-orange { background: linear-gradient(180deg, #f39c12, #d35400); animation: glow 1s infinite alternate; }
    .btn-red { background: linear-gradient(180deg, #e74c3c, #c0392b); }

    .sub-info { font-size: 10px; opacity: 0.85; }

    /* Live Bets Drawer */
    .live-bets-box {
      margin-top: 12px;
      background: #0a0d14;
      border: 1px solid #1c2332;
      border-radius: 8px;
      padding: 8px 12px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 12px;
    }
    .live-bets-box::-webkit-scrollbar { width: 4px; }
    .live-bets-box::-webkit-scrollbar-thumb { background: #232c40; }
    .live-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
      padding: 2px 0;
    }
    .live-row.win { color: #2ecc71; }

    @keyframes glow {
      0% { box-shadow: 0 0 5px rgba(243, 156, 18, 0.4); }
      100% { box-shadow: 0 0 15px rgba(243, 156, 18, 0.8); }
    }
  </style>
</head>
<body>

  <div class="aviator-container">
    <!-- Top Bar -->
    <div class="top-nav">
      <div class="logo">AVIATOR LIVE</div>
      <div class="online-badge">● <span id="online-count">1</span> Online</div>
      <div class="balance-box">₹<span id="balance">0.00</span></div>
    </div>

    <!-- Multipliers History -->
    <div class="history-scroll" id="history-box"></div>

    <!-- Flight Stage Canvas -->
    <div class="stage">
      <div class="center-overlay">
        <div class="mult-value" id="multiplier-lbl">1.00x</div>
        <div class="stage-msg" id="stage-msg">CONNECTING...</div>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Dual Bet Panels -->
    <div class="bet-grid">
      <!-- Panel 1 -->
      <div class="panel-card" id="panel-1">
        <div class="panel-header">
          <span>PANEL 1</span>
          <label class="auto-cash">
            <input type="checkbox" id="auto-check-1"> Auto:
            <input type="number" id="auto-val-1" value="2.00" step="0.1" min="1.1">x
          </label>
        </div>
        <div class="controls-row">
          <div class="input-box">
            <input type="number" id="amount-1" value="100" min="10" step="10">
          </div>
          <button class="action-btn btn-green" id="btn-1" onclick="handleBtn(1)">
            <span>BET</span>
            <span class="sub-info" id="sub-1">₹100</span>
          </button>
        </div>
      </div>

      <!-- Panel 2 -->
      <div class="panel-card" id="panel-2">
        <div class="panel-header">
          <span>PANEL 2</span>
          <label class="auto-cash">
            <input type="checkbox" id="auto-check-2"> Auto:
            <input type="number" id="auto-val-2" value="1.50" step="0.1" min="1.1">x
          </label>
        </div>
        <div class="controls-row">
          <div class="input-box">
            <input type="number" id="amount-2" value="50" min="10" step="10">
          </div>
          <button class="action-btn btn-green" id="btn-2" onclick="handleBtn(2)">
            <span>BET</span>
            <span class="sub-info" id="sub-2">₹50</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Live Multiplayer Bets Stream -->
    <div class="live-bets-box" id="live-bets">
      <div class="live-row"><span>Waiting for bets...</span></div>
    </div>
  </div>

  <script>
    const socket = io();

    // DOM Elements
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const multLbl = document.getElementById("multiplier-lbl");
    const stageMsg = document.getElementById("stage-msg");
    const balanceEl = document.getElementById("balance");
    const historyBox = document.getElementById("history-box");
    const onlineEl = document.getElementById("online-count");
    const liveBetsBox = document.getElementById("live-bets");

    // Local Game State
    let currentGameState = "COUNTDOWN";
    let serverMultiplier = 1.00;
    let localElapsed = 0;
    let particles = [];
    let propeller = 0;
    let planeX = 0, planeY = 0;
    let gridOffset = 0;

    // Client Panel States
    const panels = {
      1: { status: "IDLE", amount: 0, cashedOut: false },
      2: { status: "IDLE", amount: 0, cashedOut: false }
    };

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    /* ================= WEBSOCKET LISTENERS ================= */
    socket.on('init_sync', (data) => {
      balanceEl.textContent = data.balance.toFixed(2);
      onlineEl.textContent = data.onlineCount;
      updateHistoryUI(data.history);
      currentGameState = data.gameState;
    });

    socket.on('online_players', (count) => {
      onlineEl.textContent = count;
    });

    socket.on('round_countdown', (data) => {
      currentGameState = "COUNTDOWN";
      multLbl.classList.remove("crashed-text");
      multLbl.textContent = "1.00x";
      stageMsg.textContent = `NEXT ROUND IN ${data.seconds}s`;
      particles = [];
      updateHistoryUI(data.history);

      [1, 2].forEach(id => {
        if (panels[id].status === "QUEUED") panels[id].status = "ACTIVE";
        else if (panels[id].status === "WON") panels[id].status = "IDLE";
      });
      updateButtonsUI();
    });

    socket.on('countdown_tick', (data) => {
      stageMsg.textContent = `NEXT ROUND IN ${data.seconds}s`;
    });

    socket.on('flight_start', () => {
      currentGameState = "FLYING";
      stageMsg.textContent = "";
      localElapsed = 0;
      updateButtonsUI();
    });

    socket.on('game_tick', (data) => {
      serverMultiplier = data.multiplier;
      localElapsed = data.elapsed;
      multLbl.textContent = serverMultiplier.toFixed(2) + "x";

      // Auto cashout check
      [1, 2].forEach(id => {
        const autoCheck = document.getElementById(`auto-check-${id}`).checked;
        const autoVal = parseFloat(document.getElementById(`auto-val-${id}`).value) || 9999;
        if (autoCheck && panels[id].status === "ACTIVE" && !panels[id].cashedOut && serverMultiplier >= autoVal) {
          socket.emit('cash_out', { panel: id });
        }
      });

      updateButtonsUI();
    });

    socket.on('game_crash', (data) => {
      currentGameState = "CRASHED";
      multLbl.textContent = "FLEW AWAY!";
      multLbl.classList.add("crashed-text");
      stageMsg.textContent = `CRASHED @ ${data.crashPoint.toFixed(2)}x`;
      updateHistoryUI(data.history);

      [1, 2].forEach(id => {
        if (panels[id].status === "ACTIVE" && !panels[id].cashedOut) {
          panels[id].status = "IDLE";
        }
      });
      updateButtonsUI();
    });

    socket.on('bet_success', (data) => {
      balanceEl.textContent = data.balance.toFixed(2);
      panels[data.panel].status = data.status;
      panels[data.panel].amount = parseFloat(document.getElementById(`amount-${data.panel}`).value);
      updateButtonsUI();
    });

    socket.on('cancel_success', (data) => {
      balanceEl.textContent = data.balance.toFixed(2);
      panels[data.panel].status = "IDLE";
      panels[data.panel].amount = 0;
      updateButtonsUI();
    });

    socket.on('cashout_success', (data) => {
      balanceEl.textContent = data.balance.toFixed(2);
      panels[data.panel].cashedOut = true;
      panels[data.panel].status = "WON";
      updateButtonsUI();
    });

    socket.on('bet_error', (data) => {
      alert(data.message);
    });

    socket.on('active_bets_update', (list) => {
      liveBetsBox.innerHTML = list.map(b => `
        <div class="live-row ${b.cashedOut ? 'win' : ''}">
          <span>${b.user}</span>
          <span>₹${b.amount} ${b.cashedOut ? '(CASHED OUT)' : ''}</span>
        </div>
      `).join('') || '<div class="live-row"><span>No active bets</span></div>';
    });

    /* ================= BUTTON CLICK LOGIC ================= */
    function handleBtn(panelId) {
      const p = panels[panelId];
      const amount = parseFloat(document.getElementById(`amount-${panelId}`).value);

      if (p.status === "IDLE") {
        socket.emit('place_bet', { panel: panelId, amount });
      } else if (p.status === "QUEUED" || (p.status === "ACTIVE" && currentGameState === "COUNTDOWN")) {
        socket.emit('cancel_bet', { panel: panelId });
      } else if (p.status === "ACTIVE" && currentGameState === "FLYING" && !p.cashedOut) {
        socket.emit('cash_out', { panel: panelId });
      }
    }

    function updateButtonsUI() {
      [1, 2].forEach(id => {
        const p = panels[id];
        const btn = document.getElementById(`btn-${id}`);
        const sub = document.getElementById(`sub-${id}`);
        const amtInput = document.getElementById(`amount-${id}`);

        if (p.status === "IDLE") {
          amtInput.disabled = false;
          btn.className = "action-btn btn-green";
          btn.firstElementChild.textContent = "BET";
          sub.textContent = `₹${amtInput.value}`;
        } else if (p.status === "QUEUED") {
          amtInput.disabled = true;
          btn.className = "action-btn btn-red";
          btn.firstElementChild.textContent = "CANCEL";
          sub.textContent = "WAITING NEXT";
        } else if (p.status === "ACTIVE") {
          amtInput.disabled = true;
          if (currentGameState === "COUNTDOWN") {
            btn.className = "action-btn btn-red";
            btn.firstElementChild.textContent = "CANCEL";
            sub.textContent = `₹${p.amount}`;
          } else if (currentGameState === "FLYING") {
            btn.className = "action-btn btn-orange";
            btn.firstElementChild.textContent = "CASH OUT";
            sub.textContent = `₹${(p.amount * serverMultiplier).toFixed(2)}`;
          }
        } else if (p.status === "WON") {
          amtInput.disabled = false;
          btn.className = "action-btn btn-green";
          btn.firstElementChild.textContent = "WON";
          sub.textContent = `+₹${(p.amount * serverMultiplier).toFixed(2)}`;
        }
      });
    }

    function updateHistoryUI(list) {
      historyBox.innerHTML = list.map(v => 
        `<div class="hist-pill ${v >= 2.5 ? 'high' : ''}">${v.toFixed(2)}x</div>`
      ).join('');
    }

    /* ================= REALISTIC PLANE GRAPHICS ================= */
    function drawPlane(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Tail particles
      if (currentGameState === "FLYING") {
        particles.push({
          x: x - 35, y: y + (Math.random() * 4 - 2),
          vx: -(Math.random() * 3 + 2), vy: Math.random() * 2 - 1,
          size: Math.random() * 5 + 3, life: 1.0,
          decay: 0.04, color: Math.random() > 0.4 ? 'rgba(255, 60, 40,' : 'rgba(255, 180, 0,'
        });
      }

      // Red Fuselage
      ctx.beginPath();
      ctx.moveTo(35, 0);
      ctx.bezierCurveTo(20, -10, -25, -9, -38, -2);
      ctx.lineTo(-38, 5);
      ctx.bezierCurveTo(-25, 12, 18, 11, 35, 0);
      ctx.fillStyle = "#e51e38";
      ctx.fill();

      // Wing
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(-14, 18);
      ctx.lineTo(-24, 18);
      ctx.lineTo(-8, 0);
      ctx.fillStyle = "#b51226";
      ctx.fill();

      // Fin
      ctx.beginPath();
      ctx.moveTo(-28, -2);
      ctx.lineTo(-40, -18);
      ctx.lineTo(-46, -18);
      ctx.lineTo(-38, 0);
      ctx.fillStyle = "#ff334d";
      ctx.fill();

      // Propeller blur
      propeller += 0.8;
      ctx.save();
      ctx.translate(37, 0);
      ctx.beginPath();
      ctx.ellipse(0, 0, 2, 16, propeller, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    function renderParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.size * p.life), 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.life + ')';
        ctx.fill();
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width, h = canvas.height;

      // Moving Grid
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      gridOffset = (gridOffset + 1.2) % 40;
      for (let x = -gridOffset; x < w; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      if (currentGameState === "FLYING") {
        const t = Math.min(localElapsed / 7, 1);
        planeX = 50 + (w - 150) * Math.pow(t, 0.85);
        planeY = (h - 40) - (h - 120) * Math.pow(t, 1.25);
        const planeAngle = -0.25 - (0.08 * Math.sin(localElapsed * 4));

        // Area Fill
        ctx.beginPath();
        ctx.moveTo(35, h - 35);
        ctx.quadraticCurveTo(w * 0.35 * t, h - 35, planeX, planeY);
        ctx.lineTo(planeX, h - 35);
        const grad = ctx.createLinearGradient(0, planeY, 0, h - 35);
        grad.addColorStop(0, "rgba(229, 30, 56, 0.35)");
        grad.addColorStop(1, "rgba(229, 30, 56, 0.0)");
        ctx.fillStyle = grad;
        ctx.fill();

        // Line
        ctx.beginPath();
        ctx.moveTo(35, h - 35);
        ctx.quadraticCurveTo(w * 0.35 * t, h - 35, planeX, planeY);
        ctx.strokeStyle = "#ff2b44";
        ctx.lineWidth = 4;
        ctx.stroke();

        renderParticles();
        drawPlane(planeX, planeY, planeAngle);
      } 
      else if (currentGameState === "CRASHED") {
        planeX += 20; planeY -= 12;
        renderParticles();
        if (planeX < w + 80) drawPlane(planeX, planeY, -0.6);
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();
  </script>
</body>
</html>
