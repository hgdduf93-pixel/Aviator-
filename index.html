<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Pro - Liquid Glass</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Ambient Liquid Blur Backgrounds -->
  <div class="liquid-sphere sphere-1"></div>
  <div class="liquid-sphere sphere-2"></div>
  <div class="liquid-sphere sphere-3"></div>

  <!-- Login Modal -->
  <div id="authModal" class="modal-backdrop">
    <div class="glass-card modal-content">
      <div class="brand">
        <i class="fa-solid fa-plane-departure brand-icon"></i>
        <h2>AVIATOR<span>PRO</span></h2>
      </div>
      <p class="modal-sub">Log in with your social account or play instantly</p>
      
      <a href="/auth/google" class="btn-oauth google">
        <i class="fa-brands fa-google"></i> Continue with Google
      </a>
      <a href="/auth/facebook" class="btn-oauth facebook">
        <i class="fa-brands fa-facebook-f"></i> Continue with Facebook
      </a>
      
      <div class="separator"><span>OR</span></div>
      
      <div class="guest-input-group">
        <input type="text" id="guestNameInput" placeholder="Enter Nickname..." maxlength="15">
        <button id="guestBtn" class="btn-primary">Play as Guest</button>
      </div>
    </div>
  </div>

  <!-- Main Game Container -->
  <div class="game-wrapper">
    <!-- Navbar -->
    <header class="glass-header">
      <div class="brand-small">
        <i class="fa-solid fa-plane-up"></i>
        <span>AVIATOR</span>
      </div>

      <div class="user-panel">
        <div class="balance-card glass-pill">
          <i class="fa-solid fa-wallet"></i>
          <span id="userBalance">₹1,000.00</span>
        </div>
        <div class="user-profile glass-pill">
          <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="Avatar">
          <span id="userName">Player</span>
        </div>
      </div>
    </header>

    <!-- History Bar -->
    <div class="history-bar glass-pill" id="historyContainer">
      <!-- Dynamic Pills added via JS -->
    </div>

    <!-- Canvas Stage -->
    <div class="flight-stage glass-card">
      <div id="multiplierDisplay" class="multiplier-text">1.00x</div>
      <div id="waitingState" class="waiting-box">
        <div class="loader-line"></div>
        <p>WAITING FOR NEXT ROUND: <span id="countdownTimer">5</span>s</p>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Controls Panel -->
    <div class="control-deck glass-card">
      <div class="bet-input-box">
        <label>Bet Amount</label>
        <div class="input-stepper">
          <button id="btnMinus" class="glass-btn"><i class="fa-solid fa-minus"></i></button>
          <input type="number" id="betAmount" value="50" min="10" step="10">
          <button id="btnPlus" class="glass-btn"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="quick-chips">
          <button class="chip-btn" data-val="50">+50</button>
          <button class="chip-btn" data-val="100">+100</button>
          <button class="chip-btn" data-val="500">+500</button>
        </div>
      </div>

      <div class="action-box">
        <button id="mainActionBtn" class="btn-action bet">PLACE BET</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
