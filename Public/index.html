<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVION - Crash Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="navbar">
      <div class="brand">AVION<span>.</span></div>
      <div class="user-stats">
        <div class="wallet-badge" onclick="openAddCoinsModal()">
          <span id="userBalance">0.00</span> <small>COIN</small>
          <span class="plus-btn">+</span>
        </div>
        <button class="icon-btn" onclick="toggleAuthModal()">☰</button>
      </div>
    </header>

    <!-- Past Multipliers Ribbon -->
    <div class="history-ribbon" id="historyRibbon">
      <!-- Injected via JS -->
    </div>

    <!-- Game Screen & Canvas -->
    <div class="stage-container">
      <div class="canvas-overlay" id="canvasOverlay">
        <div class="brand-watermark">
          <span class="badge-supersonic">5x</span>
          <h2>SUPERSONIC™</h2>
        </div>
        <div class="status-msg" id="statusMessage">Bet Now</div>
        <div class="multiplier-display" id="multiplierText">1.00x</div>
      </div>
      <canvas id="gameCanvas" width="480" height="230"></canvas>
      <button class="chat-floating-pill">💬 Chat</button>
    </div>

    <!-- Dual Bet Controls -->
    <div class="controls-wrapper">
      <!-- Panel 1 -->
      <div class="bet-card" id="panel-1">
        <div class="bet-header-row">
          <div class="amount-stepper">
            <button onclick="adjustBet(1, -10)">−</button>
            <input type="number" id="amount-1" value="100.00" step="10" min="10">
            <button onclick="adjustBet(1, 10)">+</button>
          </div>
          <button class="action-btn" id="action-btn-1" onclick="handleAction(1)">
            <span class="btn-subtext">Bet</span>
            <span class="btn-maintext" id="btn-text-1">100.00 COIN</span>
          </button>
        </div>

        <div class="preset-row">
          <button onclick="setAmount(1, 100)">100</button>
          <button onclick="setAmount(1, 200)">200</button>
          <button onclick="setAmount(1, 500)">500</button>
          <button onclick="setAmount(1, 2500)">2500</button>
        </div>

        <div class="toggles-row">
          <label class="toggle-group">
            <input type="checkbox" id="auto-play-1">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Auto Play</span>
          </label>
          <label class="toggle-group">
            <input type="checkbox" id="auto-cash-toggle-1">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Auto Cashout</span>
          </label>
          <div class="stepper-mini">
            <button onclick="adjustAuto(1, -0.1)">−</button>
            <input type="number" id="auto-val-1" value="2.00" step="0.1" min="1.1">
            <button onclick="adjustAuto(1, 0.1)">+</button>
          </div>
        </div>
      </div>

      <!-- Panel 2 -->
      <div class="bet-card" id="panel-2">
        <div class="bet-header-row">
          <div class="amount-stepper">
            <button onclick="adjustBet(2, -10)">−</button>
            <input type="number" id="amount-2" value="100.00" step="10" min="10">
            <button onclick="adjustBet(2, 10)">+</button>
          </div>
          <button class="action-btn" id="action-btn-2" onclick="handleAction(2)">
            <span class="btn-subtext">Bet</span>
            <span class="btn-maintext" id="btn-text-2">100.00 COIN</span>
          </button>
        </div>

        <div class="preset-row">
          <button onclick="setAmount(2, 100)">100</button>
          <button onclick="setAmount(2, 200)">200</button>
          <button onclick="setAmount(2, 500)">500</button>
          <button onclick="setAmount(2, 2500)">2500</button>
        </div>

        <div class="toggles-row">
          <label class="toggle-group">
            <input type="checkbox" id="auto-play-2">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Auto Play</span>
          </label>
          <label class="toggle-group">
            <input type="checkbox" id="auto-cash-toggle-2">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Auto Cashout</span>
          </label>
          <div class="stepper-mini">
            <button onclick="adjustAuto(2, -0.1)">−</button>
            <input type="number" id="auto-val-2" value="2.00" step="0.1" min="1.1">
            <button onclick="adjustAuto(2, 0.1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Tabs -->
    <div class="tabs-container">
      <div class="tab active" onclick="switchTab('general')">General</div>
      <div class="tab" onclick="switchTab('my-bets')">My Bets</div>
      <div class="tab" onclick="switchTab('ratings')">Ratings</div>
    </div>
    <div class="tab-content" id="tabContent">
      <div class="empty-state">Live bets will appear here</div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-box">
      <h3 id="authTitle">Sign In / Register</h3>
      <input type="text" id="authUsername" placeholder="Username (min 3 chars)">
      <input type="password" id="authPassword" placeholder="Password">
      <div class="modal-actions">
        <button class="btn-primary" onclick="submitAuth('login')">Login</button>
        <button class="btn-secondary" onclick="submitAuth('signup')">Signup</button>
      </div>
      <button class="btn-close" onclick="toggleAuthModal()">Cancel</button>
    </div>
  </div>

  <!-- Add Coins Modal -->
  <div class="modal" id="addCoinsModal">
    <div class="modal-box">
      <h3>Add Free Coins</h3>
      <p>Select coins to credit to your balance:</p>
      <div class="coin-presets">
        <button onclick="depositCoins(500)">+ 500</button>
        <button onclick="depositCoins(1000)">+ 1,000</button>
        <button onclick="depositCoins(5000)">+ 5,000</button>
      </div>
      <button class="btn-close" onclick="closeAddCoinsModal()">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
  </html>
