<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aviator Live</title>
  <!-- Direct Fast CDN Socket.io Library (Kabhi fail nahi hoti) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0d1117;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .app {
      width: 100%;
      max-width: 420px;
      background: #151a23;
      border: 1px solid #232d3d;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    /* Top Bar */
    .header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2735;
      background: #12161f;
    }
    .brand {
      color: #e52538;
      font-weight: 900;
      font-size: 20px;
      font-style: italic;
      line-height: 1.1;
    }
    .brand small { display: block; font-size: 11px; letter-spacing: 2px; }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .badge-online {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; }
    .badge-bal {
      background: #090c10;
      border: 1px solid #283649;
      color: #4ade80;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* History */
    .history-row {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      background: #0e121a;
      overflow-x: auto;
      border-bottom: 1px solid #1a2230;
      white-space: nowrap;
    }
    .badge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
    .b-blue { color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    .b-purple { color: #c084fc; background: rgba(192, 132, 252, 0.15); }
    .b-red { color: #f43f5e; background: rgba(244, 63, 94, 0.15); }

    /* Arena */
    .arena {
      position: relative;
      height: 250px;
      background: radial-gradient(circle at 30% 70%, #1a2230 0%, #090c12 100%);
      overflow: hidden;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-size: 30px 30px;
      background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    #plane {
      position: absolute;
      width: 70px;
      height: 42px;
      z-index: 2;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 10px rgba(229, 37, 56, 0.8));
    }
    .prop { transform-origin: 89px 28px; animation: spin 0.08s linear infinite; }
    @keyframes spin { 0% { transform: scaleY(1); } 50% { transform: scaleY(-0.1); } 100% { transform: scaleY(1); } }

    .hud {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      pointer-events: none;
    }
    .hud-mult { font-size: 58px; font-weight: 900; letter-spacing: -1px; }
    .hud-sub { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; color: #8fa0b5; }
    .crashed { color: #e52538 !important; }

    /* Control Panels */
    .controls { padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #121620; }
    .panel-box {
      background: #171d27;
      border: 1px solid #263244;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #8fa0b5; font-weight: bold; }
    .panel-top label { display: flex; align-items: center; gap: 4px; }
    .auto-inp { width: 50px; background: #0c1017; border: 1px solid #2a384c; color: #fff; text-align: center; border-radius: 4px; font-size: 11px; padding: 2px; }

    .panel-main { display: flex; gap: 10px; height: 50px; }
    .stepper {
      flex: 1;
      background: #0a0d13;
      border: 1px solid #263447;
      border-radius: 8px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .stepper button { width: 34px; height: 100%; background: #192230; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .stepper input { flex: 1; background: transparent; border: none; text-align: center; color: #fff; font-size: 16px; font-weight: bold; outline: none; }

    .btn-act {
      width: 125px;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .btn-bet { background: #22c55e; color: #052e16; }
    .btn-cashout { background: #f59e0b; color: #451a03; }
    .btn-cancel { background: #ef4444; color: #fff; }

    .footer-status {
      padding: 8px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #18202d;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand">AVIATOR<small>LIVE</small></div>
    <div class="header-right">
      <div class="badge-online"><div class="dot"></div> <span id="onlineVal">1</span> Online</div>
      <div class="badge-bal">₹ <span id="balVal">1000.00</span></div>
    </div>
  </div>

  <div class="history-row" id="historyRow"></div>

  <div class="arena" id="arena">
    <div class="grid-lines"></div>
    <canvas id="cvs"></canvas>

    <svg id="plane" viewBox="0 0 100 60">
      <polygon points="10,29 0,25 0,33" fill="#ff7700"/>
      <path d="M15,29 C30,22 65,22 85,27 C92,29 95,31 85,33 C65,38 30,38 15,31 Z" fill="#e52538"/>
      <path d="M42,26 L60,8 L68,8 L54,26 Z" fill="#b91c1c"/>
      <path d="M42,32 L60,50 L68,50 L54,32 Z" fill="#991b1b"/>
      <ellipse cx="72" cy="27" rx="6" ry="2.5" fill="#38bdf8"/>
      <circle cx="89" cy="29" r="3" fill="#fff"/>
      <line class="prop" x1="89" y1="11" x2="89" y2="47" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <div class="hud">
      <div id="multText" class="hud-mult">1.00x</div>
      <div id="subText" class="hud-sub">WAITING...</div>
    </div>
  </div>

  <div class="controls">
    <!-- Panel 1 -->
    <div class="panel-box">
      <div class="panel-top">
        <span>PANEL 1</span>
        <label><input type="checkbox" id="auto1"> Auto: <input type="number" id="autoVal1" value="2.00" step="0.1" class="auto-inp">x</label>
      </div>
      <div class="panel-main">
        <div class="stepper">
          <button onclick="changeBet(1, -10)">-</button>
          <input type="number" id="bet1" value="50">
          <button onclick="changeBet(1, 10)">+</button>
        </div>
        <button id="btn1" class="btn-act btn-bet" onclick="handleBtn(1)">
          <span>BET</span><small style="font-size: 11px;">₹50</small>
        </button>
      </div>
    </div>

    <!-- Panel 2 -->
    <div class="panel-box">
      <div class="panel-top">
        <span>PANEL 2</span>
        <label><input type="checkbox" id="auto2"> Auto: <input type="number" id="autoVal2" value="1.50" step="0.1" class="auto-inp">x</label>
      </div>
      <div class="panel-main">
        <div class="stepper">
          <button onclick="changeBet(2, -10)">-</button>
          <input type="number" id="bet2" value="100">
          <button onclick="changeBet(2, 10)">+</button>
        </div>
        <button id="btn2" class="btn-act btn-bet" onclick="handleBtn(2)">
          <span>BET</span><small style="font-size: 11px;">₹100</small>
        </button>
      </div>
    </div>
  </div>

  <div class="footer-status" id="footerMsg">Connecting to live game...</div>
</div>

<script>
  // Automatic HTTPS & WebSocket selector
  const socket = io({
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionDelay: 1000
  });

  let balance = 1000.00;
  let currentMultiplier = 1.00;
  let currentState = 'WAITING';

  const myBets = {
    1: { active: false, amount: 0, cashed: false },
    2: { active: false, amount: 0, cashed: false }
  };

  const arena = document.getElementById("arena");
  const cvs = document.getElementById("cvs");
  const ctx = cvs.getContext("2d");
  const plane = document.getElementById("plane");
  const multText = document.getElementById("multText");
  const subText = document.getElementById("subText");
  const balVal = document.getElementById("balVal");
  const onlineVal = document.getElementById("onlineVal");
  const historyRow = document.getElementById("historyRow");
  const footerMsg = document.getElementById("footerMsg");

  function resizeCvs() {
    cvs.width = arena.clientWidth;
    cvs.height = arena.clientHeight;
  }
  window.addEventListener('resize', resizeCvs);
  resizeCvs();

  // Socket Connection Status Listeners
  socket.on('connect', () => {
    footerMsg.textContent = "Connected to Live Server!";
    subText.textContent = "SYNCING...";
  });

  socket.on('disconnect', () => {
    subText.textContent = "CONNECTING...";
    footerMsg.textContent = "Reconnecting...";
  });

  socket.on('online_count', (cnt) => {
    onlineVal.textContent = cnt;
  });

  socket.on('sync_init', (d) => {
    currentState = d.state;
    renderHistory(d.history);
    if (d.state === 'FLYING') {
      subText.style.display = "none";
      plane.style.opacity = "1";
    }
  });

  socket.on('waiting_tick', (d) => {
    currentState = 'WAITING';
    multText.style.display = "none";
    subText.style.display = "block";
    subText.textContent = `WAITING: ${d.countdown}s`;
    subText.className = "hud-sub";
    plane.style.opacity = "0";
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    footerMsg.textContent = "Place your bets for next round";
  });

  socket.on('game_state', (d) => {
    currentState = d.state;
    if (d.state === 'WAITING') {
      multText.style.display = "none";
      subText.style.display = "block";
      plane.style.opacity = "0";
      ctx.clearRect(0, 0, cvs.width, cvs.height);
    } else if (d.state === 'FLYING') {
      subText.style.display = "none";
      multText.style.display = "block";
      multText.className = "hud-mult";
      plane.style.opacity = "1";
      footerMsg.textContent = "Plane is flying... Cash out!";

      [1, 2].forEach(id => {
        if (myBets[id].active) {
          myBets[id].cashed = false;
          updateBtn(id, "CASHOUT", myBets[id].amount);
        }
      });
    } else if (d.state === 'CRASHED') {
      multText.textContent = d.crashPoint.toFixed(2) + "x";
      multText.className = "hud-mult crashed";
      subText.textContent = "FLEW AWAY!";
      subText.className = "hud-sub crashed";
      subText.style.display = "block";

      plane.style.transition = "all 0.4s ease-out";
      plane.style.left = `${cvs.width + 100}px`;
      plane.style.top = "-30px";

      renderHistory(d.history);

      [1, 2].forEach(id => {
        myBets[id].active = false;
        updateBtn(id, "BET", document.getElementById(`bet${id}`).value);
      });

      setTimeout(() => plane.style.transition = "opacity 0.2s", 400);
      footerMsg.textContent = "Round crashed! Preparing next round...";
    }
  });

  socket.on('flight_tick', (d) => {
    if (currentState !== 'FLYING') return;
    currentMultiplier = d.multiplier;
    multText.textContent = currentMultiplier.toFixed(2) + "x";

    [1, 2].forEach(id => {
      if (myBets[id].active && !myBets[id].cashed) {
        const liveWin = (myBets[id].amount * currentMultiplier).toFixed(2);
        updateBtn(id, "CASHOUT", liveWin);

        // Auto Cashout Logic
        const isAuto = document.getElementById(`auto${id}`).checked;
        const autoLimit = parseFloat(document.getElementById(`autoVal${id}`).value);
        if (isAuto && currentMultiplier >= autoLimit) {
          cashOut(id);
        }
      }
    });

    drawTrail(currentMultiplier);
  });

  function drawTrail(m) {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const startX = 30;
    const startY = cvs.height - 30;
    const progress = Math.min((m - 1.0) / 7.0, 1.0);

    const endX = startX + (cvs.width - 90) * Math.pow(progress, 0.85);
    const endY = startY - (cvs.height - 60) * Math.pow(progress, 1.4);
    const cpX = startX + (endX - startX) * 0.5;
    const cpY = startY;

    // Red Gradient Fill
    const grad = ctx.createLinearGradient(0, endY, 0, cvs.height);
    grad.addColorStop(0, "rgba(229, 37, 56, 0.35)");
    grad.addColorStop(1, "rgba(229, 37, 56, 0)");
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(cpX, cpY, endX, endY);
    ctx.lineTo(endX, startY);
    ctx.fillStyle = grad;
    ctx.fill();

    // Red Path Line
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(cpX, cpY, endX, endY);
    ctx.strokeStyle = "#e52538";
    ctx.lineWidth = 3.5;
    ctx.stroke();

    const angle = Math.atan2(endY - cpY, endX - cpX) * (180 / Math.PI) * 0.45;
    plane.style.left = `${endX}px`;
    plane.style.top = `${endY}px`;
    plane.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
  }

  function renderHistory(hist) {
    historyRow.innerHTML = "";
    hist.forEach(v => {
      const sp = document.createElement("span");
      sp.className = "badge " + (v >= 10 ? "b-red" : v >= 2 ? "b-purple" : "b-blue");
      sp.textContent = parseFloat(v).toFixed(2) + "x";
      historyRow.appendChild(sp);
    });
  }

  function handleBtn(id) {
    if (currentState === 'FLYING' && myBets[id].active && !myBets[id].cashed) {
      cashOut(id);
    } else if (myBets[id].active) {
      // Cancel
      balance += myBets[id].amount;
      balVal.textContent = balance.toFixed(2);
      myBets[id].active = false;
      updateBtn(id, "BET", document.getElementById(`bet${id}`).value);
    } else {
      // Place Bet
      const amt = parseFloat(document.getElementById(`bet${id}`).value);
      if (amt > balance || isNaN(amt) || amt <= 0) return alert("Paryapt balance nahi hai!");

      balance -= amt;
      balVal.textContent = balance.toFixed(2);
      myBets[id].amount = amt;
      myBets[id].active = true;

      updateBtn(id, currentState === 'WAITING' ? "CANCEL" : "BET", amt);
    }
  }

  function cashOut(id) {
    myBets[id].cashed = true;
    myBets[id].active = false;
    const win = parseFloat((myBets[id].amount * currentMultiplier).toFixed(2));
    balance += win;
    balVal.textContent = balance.toFixed(2);
    updateBtn(id, "BET", document.getElementById(`bet${id}`).value);
  }

  function updateBtn(id, type, val) {
    const btn = document.getElementById(`btn${id}`);
    btn.className = "btn-act";
    if (type === "BET") {
      btn.classList.add("btn-bet");
      btn.innerHTML = `<span>BET</span><small style="font-size:11px;">₹${val}</small>`;
    } else if (type === "CASHOUT") {
      btn.classList.add("btn-cashout");
      btn.innerHTML = `<span>CASH OUT</span><small style="font-size:11px;">₹${val}</small>`;
    } else if (type === "CANCEL") {
      btn.classList.add("btn-cancel");
      btn.innerHTML = `<span>CANCEL</span><small style="font-size:11px;">₹${val}</small>`;
    }
  }

  function changeBet(id, d) {
    const el = document.getElementById(`bet${id}`);
    el.value = Math.max(10, (parseFloat(el.value) || 0) + d);
    if (!myBets[id].active) updateBtn(id, "BET", el.value);
  }
</script>
</body>
</html>
