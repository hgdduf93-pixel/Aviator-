<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Supersonic Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #0b0e11; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; background: #12151c; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 20px; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0c0e14; border-bottom: 1px solid #1f2430; }
    .logo { font-size: 1.1rem; font-weight: 800; color: #00e676; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff334b; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .balance-box { background: #181d26; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; color: #f3f4f6; }

    .history-bar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: #08090d; scrollbar-width: none; }
    .history-bar::-webkit-scrollbar { display: none; }
    .badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
    .badge.red { color: #ff5252; background: rgba(255, 82, 82, 0.12); border: 1px solid rgba(255, 82, 82, 0.25); }
    .badge.green { color: #00e676; background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.25); }

    .display-box { position: relative; width: calc(100% - 24px); height: 210px; margin: 12px; background: radial-gradient(circle at bottom, #1b212e 0%, #0a0c10 100%); border-radius: 14px; overflow: hidden; border: 1px solid #232a3b; }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 100%; }
    .multiplier-text { font-size: 2.8rem; font-weight: 900; letter-spacing: 1px; }
    .status-subtext { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; color: #9ca3af; }
    .flew-away { color: #ff334b !important; }

    .bet-panel { background: #181d28; margin: 6px 12px; padding: 12px; border-radius: 14px; border: 1px solid #242c3d; display: flex; flex-direction: column; gap: 10px; }
    .bet-row { display: flex; gap: 10px; }
    .bet-inputs { flex: 1.1; display: flex; flex-direction: column; gap: 8px; }
    
    .counter-input { display: flex; align-items: center; justify-content: space-between; background: #0d1017; border-radius: 20px; padding: 4px 8px; border: 1px solid #2d3748; }
    .counter-btn { width: 28px; height: 28px; border-radius: 50%; background: #222a38; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .counter-value { font-weight: 700; font-size: 0.95rem; }

    .quick-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .chip-btn { background: #131720; border: 1px solid #2b3345; color: #cbd5e1; padding: 6px 0; border-radius: 14px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

    .action-btn { flex: 1; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.15s ease; text-transform: uppercase; }
    .action-btn.bet { background: #00e676; color: #000; box-shadow: 0 4px 14px rgba(0, 230, 118, 0.3); }
    .action-btn.cashout { background: #ff9100; color: #000; box-shadow: 0 4px 14px rgba(255, 145, 0, 0.3); }
    .action-btn.waiting { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .action-btn .main-label { font-size: 1.05rem; }
    .action-btn .sub-label { font-size: 0.75rem; margin-top: 2px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo"><span class="live-dot"></span> SUPERSONIC LIVE</div>
    <div class="balance-box"><span id="walletBal">0.00</span> INR</div>
  </div>

  <div class="history-bar" id="historyBar"></div>

  <div class="display-box">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay-center">
      <div id="multDisplay" class="multiplier-text">1.00x</div>
      <div id="statusDisplay" class="status-subtext">Connecting...</div>
    </div>
  </div>

  <!-- Bet Panel 1 -->
  <div class="bet-panel">
    <div class="bet-row">
      <div class="bet-inputs">
        <div class="counter-input">
          <button class="counter-btn" onclick="adjustAmount(1, -50)">−</button>
          <span class="counter-value" id="valInput1">100</span>
          <button class="counter-btn" onclick="adjustAmount(1, 50)">+</button>
        </div>
        <div class="quick-chips">
          <button class="chip-btn" onclick="setAmount(1, 100)">100</button>
          <button class="chip-btn" onclick="setAmount(1, 200)">200</button>
          <button class="chip-btn" onclick="setAmount(1, 500)">500</button>
          <button class="chip-btn" onclick="setAmount(1, 2500)">2500</button>
        </div>
      </div>
      <button class="action-btn waiting" id="btn1" onclick="handleButtonClick(1)">
        <span class="main-label">BET</span>
        <span class="sub-label"><span id="subLabel1">100.00</span> INR</span>
      </button>
    </div>
  </div>

  <!-- Bet Panel 2 -->
  <div class="bet-panel">
    <div class="bet-row">
      <div class="bet-inputs">
        <div class="counter-input">
          <button class="counter-btn" onclick="adjustAmount(2, -50)">−</button>
          <span class="counter-value" id="valInput2">100</span>
          <button class="counter-btn" onclick="adjustAmount(2, 50)">+</button>
        </div>
        <div class="quick-chips">
          <button class="chip-btn" onclick="setAmount(2, 100)">100</button>
          <button class="chip-btn" onclick="setAmount(2, 200)">200</button>
          <button class="chip-btn" onclick="setAmount(2, 500)">500</button>
          <button class="chip-btn" onclick="setAmount(2, 2500)">2500</button>
        </div>
      </div>
      <button class="action-btn waiting" id="btn2" onclick="handleButtonClick(2)">
        <span class="main-label">BET</span>
        <span class="sub-label"><span id="subLabel2">100.00</span> INR</span>
      </button>
    </div>
  </div>
</div>

<script>
  const socket = io();

  let gameState = "WAITING";
  let currentMultiplier = 1.00;
  let elapsedSeconds = 0;

  let panelData = {
    1: { amount: 100, placed: false, cashedOut: false },
    2: { amount: 100, placed: false, cashedOut: false }
  };

  const multDisplay = document.getElementById("multDisplay");
  const statusDisplay = document.getElementById("statusDisplay");
  const walletBal = document.getElementById("walletBal");
  const historyBar = document.getElementById("historyBar");
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function renderHistory(list) {
    historyBar.innerHTML = "";
    list.forEach(val => {
      const badge = document.createElement("span");
      badge.className = `badge ${val >= 2.0 ? "green" : "red"}`;
      badge.innerText = val.toFixed(2) + "X";
      historyBar.appendChild(badge);
    });
  }

  // Socket Events
  socket.on("init_player", (data) => {
    walletBal.innerText = data.balance.toFixed(2);
    renderHistory(data.history);
    gameState = data.state;
    if (gameState === "WAITING") {
      statusDisplay.innerText = `NEXT ROUND IN ${data.countdown}s`;
    }
    updateUI();
  });

  socket.on("game_state", (data) => {
    gameState = data.state;
    if (data.state === "WAITING") {
      elapsedSeconds = 0;
      currentMultiplier = 1.00;
      multDisplay.classList.remove("flew-away");
      statusDisplay.classList.remove("flew-away");
      multDisplay.innerText = "1.00x";
      statusDisplay.innerText = `NEXT ROUND IN ${data.countdown}s`;
      panelData[1].placed = false; panelData[1].cashedOut = false;
      panelData[2].placed = false; panelData[2].cashedOut = false;
      renderHistory(data.history);
    } else if (data.state === "FLYING") {
      statusDisplay.innerText = "ROUND ACTIVE";
    }
    updateUI();
  });

  socket.on("countdown_tick", (data) => {
    if (gameState === "WAITING") {
      statusDisplay.innerText = `NEXT ROUND IN ${data.countdown}s`;
    }
  });

  socket.on("multiplier_tick", (data) => {
    currentMultiplier = data.multiplier;
    elapsedSeconds = data.elapsed;
    multDisplay.innerText = currentMultiplier.toFixed(2) + "x";
    updateUI();
  });

  socket.on("game_crash", (data) => {
    gameState = "CRASHED";
    currentMultiplier = data.crashPoint;
    multDisplay.innerText = currentMultiplier.toFixed(2) + "x";
    multDisplay.classList.add("flew-away");
    statusDisplay.classList.add("flew-away");
    statusDisplay.innerText = "FLEW AWAY!";
    renderHistory(data.history);
    updateUI();
  });

  socket.on("bet_confirmed", ({ panel, balance }) => {
    panelData[panel].placed = true;
    panelData[panel].cashedOut = false;
    walletBal.innerText = balance.toFixed(2);
    updateUI();
  });

  socket.on("cashout_success", ({ panel, balance }) => {
    panelData[panel].cashedOut = true;
    walletBal.innerText = balance.toFixed(2);
    updateUI();
  });

  // User Actions
  function adjustAmount(panel, val) {
    if (panelData[panel].placed) return;
    panelData[panel].amount = Math.max(10, panelData[panel].amount + val);
    document.getElementById(`valInput${panel}`).innerText = panelData[panel].amount;
    document.getElementById(`subLabel${panel}`).innerText = panelData[panel].amount.toFixed(2);
  }

  function setAmount(panel, amt) {
    if (panelData[panel].placed) return;
    panelData[panel].amount = amt;
    document.getElementById(`valInput${panel}`).innerText = amt;
    document.getElementById(`subLabel${panel}`).innerText = amt.toFixed(2);
  }

  function handleButtonClick(panel) {
    const p = panelData[panel];
    if (gameState === "WAITING" && !p.placed) {
      socket.emit("place_bet", { panel, amount: p.amount });
    } else if (gameState === "FLYING" && p.placed && !p.cashedOut) {
      socket.emit("cashout", { panel });
    }
  }

  function updateUI() {
    [1, 2].forEach(p => {
      const btn = document.getElementById(`btn${p}`);
      const data = panelData[p];

      if (gameState === "WAITING") {
        if (data.placed) {
          btn.className = "action-btn waiting";
          btn.innerHTML = `<span class="main-label">WAITING</span><span class="sub-label">Starting soon</span>`;
        } else {
          btn.className = "action-btn bet";
          btn.innerHTML = `<span class="main-label">BET</span><span class="sub-label">${data.amount.toFixed(2)} INR</span>`;
        }
      } else if (gameState === "FLYING") {
        if (data.placed && !data.cashedOut) {
          const cashAmt = (data.amount * currentMultiplier).toFixed(2);
          btn.className = "action-btn cashout";
          btn.innerHTML = `<span class="main-label">CASHOUT</span><span class="sub-label">${cashAmt} INR</span>`;
        } else if (data.cashedOut) {
          btn.className = "action-btn waiting";
          btn.innerHTML = `<span class="main-label">WON</span><span class="sub-label">Cashed Out</span>`;
        } else {
          btn.className = "action-btn waiting";
          btn.innerHTML = `<span class="main-label">IN FLIGHT</span><span class="sub-label">Wait next round</span>`;
        }
      } else if (gameState === "CRASHED") {
        btn.className = "action-btn waiting";
        btn.innerHTML = `<span class="main-label">CRASHED</span><span class="sub-label">Round Ended</span>`;
      }
    });
  }

  // Animation Canvas Loop
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Subtle grid
    ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 35) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 35) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    if (gameState === "FLYING") {
      const progress = Math.min(elapsedSeconds / 12, 1);
      const startX = 25;
      const startY = canvas.height - 25;
      const currentX = startX + (canvas.width - 70) * progress;
      const currentY = startY - (canvas.height - 70) * Math.pow(progress, 1.4);

      // Line
      ctx.beginPath();
      ctx.strokeStyle = "#00e676";
      ctx.lineWidth = 3.5;
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (currentX - startX) * 0.5, startY, currentX, currentY);
      ctx.stroke();

      // Rocket point
      ctx.beginPath();
      ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#00e676";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
