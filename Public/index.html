<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: system-ui, sans-serif; }
    body { background: #0c1017; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 8px; }
    .aviator-app { width: 100%; max-width: 1000px; height: 92vh; max-height: 720px; background: #121824; border-radius: 12px; border: 1px solid #1e2838; display: flex; flex-direction: column; overflow: hidden; }
    .nav { height: 46px; background: #161e2e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #202b3d; }
    .brand { color: #e52538; font-weight: 900; font-size: 20px; font-style: italic; }
    .balance-badge { background: #0c1017; border: 1px solid #243247; padding: 5px 14px; border-radius: 20px; color: #4ade80; font-weight: bold; }
    .history { height: 35px; background: #0e141f; display: flex; align-items: center; gap: 6px; padding: 0 12px; overflow-x: auto; border-bottom: 1px solid #1a2332; }
    .pill { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
    .p-blue { color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    .p-purple { color: #c084fc; background: rgba(192, 132, 252, 0.15); }
    .p-red { color: #f43f5e; background: rgba(244, 63, 94, 0.15); }
    .body-grid { flex: 1; display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
    @media (max-width: 700px) { .body-grid { grid-template-columns: 1fr; } .sidebar { display: none; } }
    .sidebar { background: #0f1522; border-right: 1px solid #1c2637; display: flex; flex-direction: column; }
    .sidebar-head { padding: 10px; font-size: 12px; font-weight: bold; color: #8fa0b5; border-bottom: 1px solid #1a2434; }
    .bet-list { list-style: none; overflow-y: auto; flex: 1; }
    .bet-item { display: flex; justify-content: space-between; padding: 7px 12px; font-size: 12px; border-bottom: 1px solid #141b26; }
    .bet-item.won { background: rgba(34, 197, 94, 0.1); color: #4ade80; font-weight: bold; }
    .stage { display: flex; flex-direction: column; }
    .canvas-wrap { flex: 1; position: relative; background: radial-gradient(circle at 35% 65%, #182232 0%, #0a0e14 100%); overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    #airplane { position: absolute; width: 75px; height: 45px; z-index: 2; transform: translate(-50%, -50%); filter: drop-shadow(0 0 10px rgba(229,37,56,0.8)); }
    .prop { transform-origin: 89px 28px; animation: spin 0.08s linear infinite; }
    @keyframes spin { 0% { transform: scaleY(1); } 50% { transform: scaleY(-0.1); } 100% { transform: scaleY(1); } }
    .hud { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 3; pointer-events: none; }
    .hud-multiplier { font-size: 68px; font-weight: 900; letter-spacing: -2px; }
    .hud-status { font-size: 18px; font-weight: 800; text-transform: uppercase; margin-top: 4px; }
    .crashed { color: #e52538 !important; }
    .controls { height: 130px; background: #141c2b; border-top: 1px solid #1f2a3a; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
    .panel { background: #192334; border: 1px solid #243248; border-radius: 8px; padding: 8px; display: flex; gap: 8px; align-items: center; }
    .input-grp { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .counter { display: flex; background: #0c1017; border: 1px solid #2a3a52; border-radius: 6px; overflow: hidden; }
    .counter button { background: #1f2a3b; border: none; color: #fff; width: 30px; font-size: 16px; cursor: pointer; }
    .counter input { flex: 1; background: transparent; border: none; text-align: center; color: #fff; font-size: 15px; font-weight: bold; outline: none; }
    .btn-act { width: 110px; height: 100%; border: none; border-radius: 8px; font-size: 17px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn-bet { background: #22c55e; color: #052e16; }
    .btn-cashout { background: #f59e0b; color: #451a03; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
    .btn-cancel { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
<div class="aviator-app">
  <div class="nav">
    <div class="brand">✈ AVIATOR</div>
    <div class="balance-badge">₹ <span id="balance">1000.00</span></div>
  </div>
  <div class="history" id="historyBar"></div>
  <div class="body-grid">
    <div class="sidebar">
      <div class="sidebar-head">ALL BETS</div>
      <ul class="bet-list" id="betsList"></ul>
    </div>
    <div class="stage">
      <div class="canvas-wrap" id="wrap">
        <canvas id="cvs"></canvas>
        <svg id="airplane" viewBox="0 0 100 60">
          <polygon points="10,29 0,25 0,33" fill="#ff7700"/>
          <path d="M15,29 C30,22 65,22 85,27 C92,29 95,31 85,33 C65,38 30,38 15,31 Z" fill="#e52538"/>
          <path d="M42,26 L60,8 L68,8 L54,26 Z" fill="#b91c1c"/>
          <path d="M42,32 L60,50 L68,50 L54,32 Z" fill="#991b1b"/>
          <ellipse cx="72" cy="27" rx="6" ry="2.5" fill="#38bdf8"/>
          <circle cx="89" cy="29" r="3" fill="#fff"/>
          <line class="prop" x1="89" y1="11" x2="89" y2="47" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="hud">
          <div id="multiplierVal" class="hud-multiplier">1.00x</div>
          <div id="statusVal" class="hud-status"></div>
        </div>
      </div>
      <div class="controls">
        <div class="panel">
          <div class="input-grp">
            <div class="counter">
              <button onclick="change(1, -10)">-</button>
              <input type="number" id="inp1" value="50">
              <button onclick="change(1, 10)">+</button>
            </div>
          </div>
          <button id="btn1" class="btn-act btn-bet" onclick="pressAction(1)">
            <span>BET</span><small>₹50</small>
          </button>
        </div>
        <div class="panel">
          <div class="input-grp">
            <div class="counter">
              <button onclick="change(2, -10)">-</button>
              <input type="number" id="inp2" value="100">
              <button onclick="change(2, 10)">+</button>
            </div>
          </div>
          <button id="btn2" class="btn-act btn-bet" onclick="pressAction(2)">
            <span>BET</span><small>₹100</small>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const socket = io();
  let balance = 1000.00;
  let serverGameState = 'WAITING';
  let curMult = 1.00;
  const bets = { 1: { active: false, amount: 0 }, 2: { active: false, amount: 0 } };

  const cvs = document.getElementById("cvs");
  const ctx = cvs.getContext("2d");
  const wrap = document.getElementById("wrap");
  const plane = document.getElementById("airplane");
  const multText = document.getElementById("multiplierVal");
  const statusText = document.getElementById("statusVal");
  const balEl = document.getElementById("balance");
  const histBar = document.getElementById("historyBar");
  const betsList = document.getElementById("betsList");

  function fit() { cvs.width = wrap.clientWidth; cvs.height = wrap.clientHeight; }
  window.addEventListener('resize', fit);
  fit();

  socket.on('init_state', (d) => { serverGameState = d.gameState; renderHist(d.history); });
  socket.on('waiting_tick', (d) => {
    serverGameState = 'WAITING';
    multText.style.display = "none";
    statusText.style.display = "block";
    statusText.textContent = `WAITING: ${d.countdown}s`;
    statusText.style.color = "#94a3b8";
    plane.style.opacity = "0";
    ctx.clearRect(0, 0, cvs.width, cvs.height);
  });
  socket.on('round_waiting', () => { betsList.innerHTML = ""; });
  socket.on('round_started', () => {
    serverGameState = 'FLYING';
    statusText.style.display = "none";
    multText.style.display = "block";
    multText.className = "hud-multiplier";
    plane.style.opacity = "1";
    [1, 2].forEach(id => {
      if (bets[id].active) setBtn(id, "CASHOUT", bets[id].amount);
    });
  });
  socket.on('multiplier_tick', (d) => {
    if (serverGameState !== 'FLYING') return;
    curMult = d.multiplier;
    multText.textContent = curMult.toFixed(2) + "x";
    [1, 2].forEach(id => {
      if (bets[id].active) setBtn(id, "CASHOUT", (bets[id].amount * curMult).toFixed(2));
    });
    drawFlight(curMult);
  });
  socket.on('round_crashed', (d) => {
    serverGameState = 'CRASHED';
    multText.textContent = d.crashPoint.toFixed(2) + "x";
    multText.className = "hud-multiplier crashed";
    statusText.textContent = "FLEW AWAY!";
    statusText.className = "hud-status crashed";
    statusText.style.display = "block";
    plane.style.transition = "all 0.5s ease-out";
    plane.style.left = `${cvs.width + 120}px`;
    plane.style.top = "-40px";
    renderHist(d.history);
    [1, 2].forEach(id => {
      bets[id].active = false;
      setBtn(id, "BET", document.getElementById(`inp${id}`).value);
    });
    setTimeout(() => plane.style.transition = "opacity 0.2s", 500);
  });
  socket.on('new_bet_broadcast', (b) => {
    const li = document.createElement("li");
    li.className = "bet-item";
    li.innerHTML = `<span>${b.username}</span><span>₹${b.amount}</span>`;
    betsList.prepend(li);
  });
  socket.on('cashout_success', (d) => {
    balance += d.win;
    balEl.textContent = balance.toFixed(2);
    bets[d.betId].active = false;
    setBtn(d.betId, "BET", document.getElementById(`inp${d.betId}`).value);
  });
  function drawFlight(multiplier) {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const startX = 35;
    const startY = cvs.height - 35;
    const p = Math.min((multiplier - 1.0) / 8.0, 1.0);
    const endX = startX + (cvs.width - 120) * Math.pow(p, 0.85);
    const endY = startY - (cvs.height - 80) * Math.pow(p, 1.35);
    const cpX = startX + (endX - startX) * 0.5;
    const cpY = startY;

    const grad = ctx.createLinearGradient(0, endY, 0, cvs.height);
    grad.addColorStop(0, "rgba(229, 37, 56, 0.35)");
    grad.addColorStop(1, "rgba(229, 37, 56, 0)");
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(cpX, cpY, endX, endY);
    ctx.lineTo(endX, startY);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(cpX, cpY, endX, endY);
    ctx.strokeStyle = "#e52538";
    ctx.lineWidth = 4;
    ctx.stroke();

    const angle = Math.atan2(endY - cpY, endX - cpX) * (180 / Math.PI) * 0.45;
    plane.style.left = `${endX}px`;
    plane.style.top = `${endY}px`;
    plane.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
  }
  function renderHist(hist) {
    histBar.innerHTML = "";
    hist.forEach(v => {
      const s = document.createElement("span");
      s.className = "pill " + (v >= 10 ? "p-red" : v >= 2 ? "p-purple" : "p-blue");
      s.textContent = parseFloat(v).toFixed(2) + "x";
      histBar.appendChild(s);
    });
  }
  function pressAction(id) {
    if (serverGameState === 'FLYING' && bets[id].active) {
      socket.emit('request_cashout', { betId: id });
    } else {
      const amt = parseFloat(document.getElementById(`inp${id}`).value);
      if (amt > balance) return alert("Low Balance!");
      balance -= amt;
      balEl.textContent = balance.toFixed(2);
      bets[id].amount = amt;
      bets[id].active = true;
      setBtn(id, serverGameState === 'WAITING' ? "CANCEL" : "BET", amt);
      socket.emit('place_bet', { betId: id, amount: amt });
    }
  }
  function setBtn(id, type, val) {
    const btn = document.getElementById(`btn${id}`);
    btn.className = "btn-act";
    if (type === "BET") {
      btn.classList.add("btn-bet");
      btn.innerHTML = `<span>BET</span><small>₹${val}</small>`;
    } else if (type === "CASHOUT") {
      btn.classList.add("btn-cashout");
      btn.innerHTML = `<span>CASH OUT</span><small>₹${val}</small>`;
    } else if (type === "CANCEL") {
      btn.classList.add("btn-cancel");
      btn.innerHTML = `<span>CANCEL</span><small>₹${val}</small>`;
    }
  }
  function change(id, delta) {
    const el = document.getElementById(`inp${id}`);
    el.value = Math.max(10, (parseFloat(el.value) || 0) + delta);
    if (!bets[id].active) setBtn(id, "BET", el.value);
  }
</script>
</body>
</html>
